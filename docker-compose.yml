name: beach-count

services:
  beachcount:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beachcount
    privileged: true
    shm_size: '1g'
    ports:
      - "8888:8888"
    volumes:
      - ./src:/project/src
      - ./notebooks:/project/notebooks
      - "${DATASET_ROOT:-./data}:/project/data"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["poetry", "run", "jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''"]
    # restart: unless-stopped
    networks:
      - ltm-net

networks:
  ltm-net:
    driver: bridge
    
