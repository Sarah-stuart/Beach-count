[tool.poetry]
name = "beach-count"
version = "0.1.0"
description = "beach count project"
authors = ["Sarah Stuart", "Joseph Cincotta"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
jinja2 = "^3.1.6"
tqdm = "^4.70.0"
pillow = "^12.3.0"
LightAgent = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"
black = "^26.5.1"
flake8 = "^7.3.0"
jupyterlab = "^4.6.2"
ipykernel = "^7.3.0"
ipywidgets = "^8.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 128
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
  | notebooks
)/
'''
